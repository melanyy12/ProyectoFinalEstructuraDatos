<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analítica - FintechWallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
        .navbar { background: #1e293b; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .navbar h1 { color: #38bdf8; font-size: 22px; }
        .navbar a { color: #94a3b8; text-decoration: none; margin-left: 24px; font-size: 14px; }
        .navbar a:hover { color: #38bdf8; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 24px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { color: #94a3b8; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }
        .stat-card p { font-size: 28px; font-weight: 700; color: #38bdf8; }
        .section { background: #1e293b; border-radius: 12px; padding: 28px; margin-bottom: 28px; border: 1px solid #334155; }
        .section h2 { font-size: 18px; margin-bottom: 20px; color: #f1f5f9; }
        .user-rank { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #0f172a; }
        .user-rank:last-child { border-bottom: none; }
        .rank-num { width: 32px; height: 32px; border-radius: 50%; background: #0f172a; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #38bdf8; }
        .rank-info h4 { font-size: 15px; }
        .rank-info p { font-size: 12px; color: #94a3b8; }
        .rank-pts { font-size: 18px; font-weight: 700; color: #4ade80; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 10px; }
        .badge-bronce { background: #78350f; color: #fcd34d; }
        .badge-plata { background: #1e3a5f; color: #93c5fd; }
        .badge-oro { background: #3b2100; color: #fbbf24; }
        .badge-platino { background: #1e1b4b; color: #a78bfa; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-item { background: #0f172a; border-radius: 10px; padding: 20px; border: 1px solid #334155; }
        .info-item h4 { font-size: 13px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
        .info-item p { font-size: 22px; font-weight: 700; }
        .ciclo-si { color: #f87171; }
        .ciclo-no { color: #4ade80; }
        .back-link { color: #94a3b8; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 20px; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>💳 FintechWallet</h1>
    <div>
        <a href="/">Inicio</a>
        <a href="/analitica">Analítica</a>
    </div>
</nav>

<div class="container">
    <a href="/" class="back-link">← Volver al inicio</a>

    <h2 style="font-size:24px; margin-bottom:28px;">📊 Panel de Analítica</h2>

    <div class="stats">
        <div class="stat-card">
            <h3>Vértices Grafo</h3>
            <p th:text="${vertices}">0</p>
        </div>
        <div class="stat-card">
            <h3>Aristas Grafo</h3>
            <p th:text="${aristas}">0</p>
        </div>
        <div class="stat-card">
            <h3>Top Usuarios</h3>
            <p th:text="${#lists.size(topUsuarios)}">0</p>
        </div>
        <div class="stat-card">
            <h3>Ciclos</h3>
            <p th:class="${ciclos ? 'ciclo-si' : 'ciclo-no'}"
               th:text="${ciclos ? 'Sí' : 'No'}">No</p>
        </div>
    </div>

    <div class="section">
        <h2>🏆 Top Usuarios por Puntos (Árbol BST)</h2>
        <div th:each="u, stat : ${topUsuarios}">
            <div class="user-rank">
                <div style="display:flex; align-items:center; gap:14px;">
                    <div class="rank-num" th:text="${stat.index + 1}">1</div>
                    <div class="rank-info">
                        <h4>
                            <span th:text="${u.nombre}">Nombre</span>
                            <span class="badge"
                                  th:classappend="${u.nivel.
