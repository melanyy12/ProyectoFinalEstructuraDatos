<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FintechWallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
        .navbar { background: #1e293b; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .navbar h1 { color: #38bdf8; font-size: 22px; }
        .navbar a { color: #94a3b8; text-decoration: none; margin-left: 24px; font-size: 14px; }
        .navbar a:hover { color: #38bdf8; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 24px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
        .stat-card h3 { color: #94a3b8; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }
        .stat-card p { font-size: 32px; font-weight: 700; color: #38bdf8; }
        .section { background: #1e293b; border-radius: 12px; padding: 28px; margin-bottom: 28px; border: 1px solid #334155; }
        .section h2 { font-size: 18px; margin-bottom: 20px; color: #f1f5f9; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; color: #94a3b8; }
        .form-group input, .form-group select { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #38bdf8; }
        .btn { background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; padding: 11px 24px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .btn:hover { background: #0ea5e9; }
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .user-card { background: #0f172a; border-radius: 10px; padding: 20px; border: 1px solid #334155; }
        .user-card h3 { font-size: 16px; margin-bottom: 4px; }
        .user-card p { font-size: 13px; color: #94a3b8; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-bronce { background: #78350f; color: #fcd34d; }
        .badge-plata { background: #1e3a5f; color: #93c5fd; }
        .badge-oro { background: #3b2100; color: #fbbf24; }
        .badge-platino { background: #1e1b4b; color: #a78bfa; }
        .btn-outline { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 8px; }
        .btn-outline:hover { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>💳 FintechWallet</h1>
    <div>
        <a href="/">Inicio</a>
        <a href="/analitica">Analítica</a>
    </div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card">
            <h3>Total Usuarios</h3>
            <p th:text="${totalUsuarios}">0</p>
        </div>
        <div class="stat-card">
            <h3>Total Billeteras</h3>
            <p th:text="${totalBilleteras}">0</p>
        </div>
        <div class="stat-card">
            <h3>Plataforma</h3>
            <p>Activa ✓</p>
        </div>
    </div>

    <div class="section">
         <h2>Buscar Usuario</h2>
        <form action="/usuario/buscar" method="get" style="display:flex;gap:12px;align-items:flex-end;">
            <div class="form-group" style="flex:1;margin:0;">
                <label>ID Usuario</label>
                <input type="text" name="id" placeholder="U001" required/>
            </div>
            <button type="submit" class="btn" style="margin:0;">Buscar</button>
        </form>
        <p th:if="${errorBusqueda != null}"
           style="color:#f87171;font-size:13px;margin-top:12px;"
           th:text="${errorBusqueda}">Error</p>
    </div>
        <h2>Registrar Usuario</h2>
        <form action="/usuario/registrar" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="text" name="id" placeholder="U001" required/>
                </div>
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" name="nombre" placeholder="Juan Pérez" required/>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="juan@email.com" required/>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" name="telefono" placeholder="3001234567" required/>
                </div>
            </div>
            <button type="submit" class="btn">Registrar Usuario</button>
        </form>
    </div>

    <div class="section">
        <h2>Usuarios Registrados</h2>
        <div class="users-grid">
            <div th:each="usuario : ${usuarios}" class="user-card">
                <h3 th:text="${usuario.nombre}">Nombre</h3>
                <p th:text="${usuario.email}">email</p>
                <span class="badge"
                      th:classappend="${usuario.nivel.name() == 'BRONCE' ? 'badge-bronce' : (usuario.nivel.name() == 'PLATA' ? 'badge-plata' : (usuario.nivel.name() == 'ORO' ? 'badge-oro' : 'badge-platino'))}"
                      th:text="${usuario.nivel}">NIVEL</span>
                <p style="margin-top:8px; font-size:13px;">
                    Puntos: <strong th:text="${usuario.puntosTotales}">0</strong>
                </p>
                <a th:href="@{/usuarios/{id}(id=${usuario.id})}" class="btn-outline">Ver detalle →</a>
            </div>
        </div>
        <p th:if="${totalUsuarios == 0}" style="color:#64748b;">No hay usuarios registrados aún.</p>
    </div>
</div>
</body>
</html>
